<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: "DM Sans"; src: url("assets/dm-sans-var.woff2") format("woff2"); font-weight: 100 1000; }
    html, body { margin: 0; background: #F3F5F8; }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3F5F8; font-family: "DM Sans", sans-serif; }
    .lane { position: absolute; left: 0; width: 1920px; height: 270px; overflow: hidden; }
    .cam { position: absolute; left: 200px; top: 15px; width: 1400px; height: 240px; background: #fff; border-radius: 12px; }
    .word { position: absolute; left: 500px; top: 100px; font-size: 16px; color: #111827; white-space: nowrap; }
    canvas.word { top: 96px; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3">
    <div class="lane" style="top:0"><div class="cam" id="c1"><div class="word">Verified</div></div></div>
    <div class="lane" style="top:270px"><div class="cam" id="c2"><div class="word">Verified</div></div></div>
    <div class="lane" style="top:540px"><div class="cam" id="c3"><div class="word">Verified</div></div></div>
    <div class="lane" style="top:810px"><div class="cam" id="c4"><canvas class="word" id="cv" width="120" height="30"></canvas></div></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const pan = (id, px) => tl.fromTo(id, { x: 0 }, { x: -px, duration: 3, ease: "none", immediateRender: false }, 0);
    pan("#c1", 90); pan("#c2", 180); pan("#c3", 360); pan("#c4", 36); // 0.5, 1, 2 px/frame text; 0.2 px/frame canvas
    document.fonts.load('16px "DM Sans"').then(() => { const g = document.getElementById("cv").getContext("2d"); g.font = '16px "DM Sans"'; g.fillStyle = "#111827"; g.textBaseline = "top"; g.fillText("Verified", 0, 4); });
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
